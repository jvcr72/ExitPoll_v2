<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Votación</title>
</head>
<body>
    <h2>Login</h2>
    <input type="text" id="user" placeholder="Usuario">
    <input type="password" id="pass" placeholder="Contraseña">
    <button onclick="login()">Entrar</button>

    <hr>

    <h2>Registrar Voto (Requiere Login)</h2>
    <input type="text" id="nombre" placeholder="Nombre">
    <button onclick="enviarVoto()">Enviar Voto</button>

    <script>
        let token = "";

        async function login() {
            const res = await fetch("https://exitpoll-v2-produccion.onrender.com/login", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({username: document.getElementById('user').value, password: document.getElementById('pass').value})
            });
            const data = await res.json();
            token = data.access_token;
            alert("Login exitoso");
        }

        async function enviarVoto() {
            const data = { /* recoge tus campos aquí */ };
            const res = await fetch("https://exitpoll-v2-produccion.onrender.com/voto", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify(data)
            });
            alert(res.ok ? "Voto registrado" : "Error en el voto");
        }
    </script>
</body>
</html>
